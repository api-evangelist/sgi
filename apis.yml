name: SGI (Silicon Graphics)
description: >-
  SGI, or Silicon Graphics, was a workstation, server, supercomputing, and
  computer-graphics company founded in 1982 and one of Mayfield's landmark
  early portfolio companies. It pioneered high-performance 3D graphics
  hardware, the IRIX operating system, and the OpenGL API. The independent
  company was acquired by Rackable Systems in 2009 (which adopted the SGI
  name) and that business was in turn acquired by Hewlett Packard Enterprise
  (HPE) in 2016. There is no longer an independent SGI developer program or
  public API surface; the historic sgi.com domain now redirects to HPE's
  high-performance-computing product line. This profile is retained as a
  historic Mayfield portfolio record; it is not an active API provider.
